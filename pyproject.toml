[project]
name = "voice-dictation"
version = "0.1.0"
description = "GTK4 layer-shell overlay UI for the sunoto voice-dictation daemon"
requires-python = ">=3.13"
# The overlay uses GTK4 via PyGObject, which comes from system packages
# (python3-gi + gir1.2-gtk-4.0; on Wayland also gtk4-layer-shell), not PyPI.
# python-xlib drives the EWMH anchoring fallback on X11 sessions.
dependencies = [
    "python-xlib>=0.33",
]

[project.scripts]
vd-overlay = "voice_dictation.ui_sidecar:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
