[project]
name = "voice-dictation"
version = "0.1.0"
description = "GTK4 layer-shell overlay UI for the sunoto voice-dictation daemon"
requires-python = ">=3.13"
# The overlay uses GTK4 + gtk4-layer-shell via PyGObject, which come from
# system packages (python-gobject, gtk4-layer-shell), not PyPI.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
