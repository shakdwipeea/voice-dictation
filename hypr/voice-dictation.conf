# Voice dictation hotkey for Hyprland/Wayland.
# Source this from your ~/.config/hypr/bindings.conf:
#   source = ~/.config/hypr/voice-dictation.conf

bindd = CTRL, F1, Voice dictation start, exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger press
bindrd = CTRL, F1, Voice dictation stop, exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindrd = , F1, Voice dictation stop, exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release

# Media-mode aliases for keyboards that send special keys instead of F-keys.
bindd = CTRL, XF86MonBrightnessDown, Voice dictation start (F1 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger press
bindrd = CTRL, XF86MonBrightnessDown, Voice dictation stop (F1 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindrd = , XF86MonBrightnessDown, Voice dictation stop (F1 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindd = CTRL, F8, Voice dictation start (legacy), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger press
bindrd = CTRL, F8, Voice dictation stop (legacy), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindrd = , F8, Voice dictation stop (legacy), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindd = CTRL, XF86AudioPlay, Voice dictation start (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger press
bindrd = CTRL, XF86AudioPlay, Voice dictation stop (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindrd = , XF86AudioPlay, Voice dictation stop (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindd = CTRL, XF86AudioPause, Voice dictation start (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger press
bindrd = CTRL, XF86AudioPause, Voice dictation stop (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
bindrd = , XF86AudioPause, Voice dictation stop (F8 media-mode), exec, __SUNOTO_ROOT__/target/release/sunoto-daemon trigger release
