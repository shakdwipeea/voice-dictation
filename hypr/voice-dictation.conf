# Voice dictation hotkey for Hyprland.
# Source this from your ~/.config/hypr/bindings.conf:
#   source = ~/.config/hypr/voice-dictation.conf
#
# Press SUPER+I to start recording; press again to stop, transcribe, and paste.

# Path is rewritten by install.sh to the user's actual venv.
bindd = SUPER, I, Voice dictation toggle, exec, __VENV_BIN__/vd toggle
