[workspace]
members = [
  "apps/daemon",
  "crates/sunoto-audio",
  "crates/sunoto-core",
  "crates/sunoto-ipc",
  "crates/sunoto-linux",
  "crates/sunoto-polish",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
