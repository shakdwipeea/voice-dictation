name: release

# Tag a commit `vX.Y.Z` and this builds the self-contained macOS app on an
# Apple silicon runner and attaches it to the GitHub release under stable
# asset names, which install-macos.sh downloads via .../releases/latest/download/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build Sunoto.app
        run: bash packaging/macos/build-app.sh
      # Installed apps update themselves only to a zip signed with this key
      # (public half: packaging/macos/release-signing.pub). The trusted
      # comment names the version, so an older zip cannot pose as a newer one.
      - name: Sign the zip for the in-app updater
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          brew install minisign
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/Sunoto-macos-arm64.zip \
            -t "Sunoto ${GITHUB_REF_NAME#v} Sunoto-macos-arm64.zip"
          rm -f "$key"
          minisign -V -p packaging/macos/release-signing.pub -m dist/Sunoto-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sunoto-macos-arm64
          path: |
            dist/Sunoto-macos-arm64.zip
            dist/Sunoto-macos-arm64.zip.sha256
            dist/Sunoto-macos-arm64.zip.minisig
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sunoto-macos-arm64.zip
            dist/Sunoto-macos-arm64.zip.sha256
            dist/Sunoto-macos-arm64.zip.minisig
